<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Impactos - Green Egg</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-number {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .low { color: #4CAF50; }
        .medium { color: #FF9800; }
        .high { color: #F44336; }
        
        .impacts-table {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f5f5f5;
        }
        
        .severity-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85em;
            display: inline-block;
        }
        
        .badge-low {
            background: #E8F5E9;
            color: #2E7D32;
        }
        
        .badge-medium {
            background: #FFF3E0;
            color: #EF6C00;
        }
        
        .badge-high {
            background: #FFEBEE;
            color: #C62828;
        }
        
        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .status {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-connected {
            background: #E8F5E9;
            color: #2E7D32;
        }
        
        .status-disconnected {
            background: #FFEBEE;
            color: #C62828;
        }
        
        .pulse {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Monitor de Impactos Green Egg</h1>
            <p class="subtitle">Sistema de control de calidad en transporte de piezas cerámicas</p>
        </header>
        
        <div class="controls">
            <button onclick="refreshData()">🔄 Actualizar</button>
            <button onclick="clearData()">🗑️ Limpiar Datos</button>
            <button onclick="exportCSV()">📥 Exportar CSV</button>
            <div style="flex-grow: 1;"></div>
            <div class="status status-connected">
                <div class="pulse"></div>
                Sistema Activo
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Impactos</div>
                <div class="stat-number" id="total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Impactos Bajos</div>
                <div class="stat-number low" id="low">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Impactos Medios</div>
                <div class="stat-number medium" id="medium">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Impactos Altos</div>
                <div class="stat-number high" id="high">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Magnitud Promedio</div>
                <div class="stat-number" id="avg">0.0</div>
                <div class="stat-label">G</div>
            </div>
        </div>
        
        <div class="impacts-table">
            <h2 style="margin-bottom: 20px;">📊 Últimos Impactos Detectados</h2>
            <div id="table-container">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <p>No hay impactos registrados aún</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:3000/api';
        
        // Cargar datos al iniciar
        window.onload = () => {
            refreshData();
            // Auto-actualizar cada 5 segundos
            setInterval(refreshData, 5000);
        };
        
        // Actualizar datos
        async function refreshData() {
            try {
                // Obtener estadísticas
                const statsRes = await fetch(`${API_URL}/stats`);
                const stats = await statsRes.json();
                
                document.getElementById('total').textContent = stats.total;
                document.getElementById('low').textContent = stats.low;
                document.getElementById('medium').textContent = stats.medium;
                document.getElementById('high').textContent = stats.high;
                document.getElementById('avg').textContent = stats.avgMagnitude;
                
                // Obtener impactos
                const impactsRes = await fetch(`${API_URL}/impacts?limit=50`);
                const data = await impactsRes.json();
                
                displayImpacts(data.impacts);
            } catch(error) {
                console.error('Error al cargar datos:', error);
            }
        }
        
        // Mostrar tabla de impactos
        function displayImpacts(impacts) {
            const container = document.getElementById('table-container');
            
            if(impacts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <p>No hay impactos registrados aún</p>
                    </div>
                `;
                return;
            }
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Fecha/Hora</th>
                            <th>Magnitud (G)</th>
                            <th>Ejes (X, Y, Z)</th>
                            <th>Severidad</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            // Mostrar los más recientes primero
            impacts.reverse().forEach(impact => {
                const date = new Date(impact.timestamp);
                const formattedDate = date.toLocaleString('es-MX');
                const badgeClass = `badge-${impact.severity.toLowerCase()}`;
                
                html += `
                    <tr>
                        <td>${formattedDate}</td>
                        <td><strong>${parseFloat(impact.magnitude).toFixed(2)}</strong></td>
                        <td>${parseFloat(impact.x).toFixed(2)}, ${parseFloat(impact.y).toFixed(2)}, ${parseFloat(impact.z).toFixed(2)}</td>
                        <td><span class="severity-badge ${badgeClass}">${impact.severity}</span></td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            container.innerHTML = html;
        }
        
        // Limpiar datos
        async function clearData() {
            if(confirm('¿Estás seguro de que quieres limpiar todos los datos?')) {
                try {
                    await fetch(`${API_URL}/impacts`, { method: 'DELETE' });
                    refreshData();
                    alert('Datos limpiados correctamente');
                } catch(error) {
                    alert('Error al limpiar datos');
                }
            }
        }
        
        // Exportar a CSV
        async function exportCSV() {
            try {
                const res = await fetch(`${API_URL}/impacts?limit=10000`);
                const data = await res.json();
                
                let csv = 'Timestamp,Magnitud,X,Y,Z,Severidad\n';
                data.impacts.forEach(impact => {
                    csv += `${impact.timestamp},${impact.magnitude},${impact.x},${impact.y},${impact.z},${impact.severity}\n`;
                });
                
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `impactos_${new Date().toISOString()}.csv`;
                a.click();
            } catch(error) {
                alert('Error al exportar CSV');
            }
        }
    </script>
</body>
</html>
